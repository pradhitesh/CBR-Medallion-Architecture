[delembic]
# Default section — Bronze, for backward-compat with plain `delembic` (no -n).
# Use `-n silver` / `-n gold` to target the other layers.
script_location = delembic/bronze
alembic_config = alembic.ini
filename_template = %(year)s_%(month)s_%(day)s_%(hour)s%(minute)s%(second)s_%(revision)s_%(slug)s

[bronze]
script_location = delembic/bronze
alembic_config = alembic.ini
